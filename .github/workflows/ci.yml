
name: TaxiFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Check Python syntax
        run: |
          python -m compileall -q src tests

      - name: Configure dbt profile
        run: |
          mkdir -p .github/dbt-profile
          cat > .github/dbt-profile/profiles.yml <<'EOF'
          taxiflow:
            target: dev
            outputs:
              dev:
                type: duckdb
                path: /tmp/taxiflow-ci.duckdb
                schema: analytics
                threads: 2
          EOF

      - name: Validate dbt project
        run: |
          dbt parse --profiles-dir .github/dbt-profile
```

En esta configuración usamos una conexión DuckDB temporal para validar dbt. No hace falta subir tu `profiles.yml` local ni tus archivos Parquet.

Los workflows de GitHub Actions pueden ejecutarse automáticamente ante eventos como `push` y `pull_request`. <Cite ref="turn226359search1"/>

### 3. Verificar el archivo

Ejecutá:

```powershell
Get-ChildItem .github\workflows
```

Debería aparecer `ci.yml`.

Después validá su estructura YAML:

```powershell
@'
from pathlib import Path
import yaml

ruta = Path(".github/workflows/ci.yml")
datos = yaml.safe_load(ruta.read_text(encoding="utf-8-sig"))

assert isinstance(datos, dict)
assert "jobs" in datos
assert "verificar" in datos["jobs"]

print("Workflow CI: estructura YAML correcta")
'@ | python
```

Esta comprobación valida la sintaxis y estructura básica, pero la ejecución real debe confirmarse en GitHub.

### 4. Publicar el workflow

```powershell
git add .github/workflows/ci.yml
git commit -m "ci: add automated Python and dbt validation"
git push origin main
```

### 5. Comprobar GitHub Actions

Abrí <Link url="https://github.com/Franco97sassi/TaxiFlow/actions" title="GitHub Actions — TaxiFlow"/>.

Buscá el workflow **TaxiFlow CI** y verificá que termine correctamente.

