
name: TaxiFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Check Python syntax
        run: |
          python -m compileall -q src tests

      - name: Configure dbt profile
        run: |
          mkdir -p .github/dbt-profile
          printf 'taxiflow:\n  target: dev\n  outputs:\n    dev:\n      type: duckdb\n      path: /tmp/taxiflow-ci.duckdb\n      schema: analytics\n      threads: 2\n' > .github/dbt-profile/profiles.yml

      - name: Validate dbt project
        run: |
          dbt parse --profiles-dir .github/dbt-profile
